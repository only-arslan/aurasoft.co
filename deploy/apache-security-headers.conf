# Security response headers for aurasoft.co
#
# Install to /etc/apache2/conf-available/security-headers.conf, then:
#   sudo a2enmod headers
#   sudo a2enconf security-headers
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Set at the Apache level rather than in PHP so the headers also cover static
# assets (CSS, JS, images), not only PHP-rendered pages.

<IfModule mod_headers.c>

    # Force HTTPS for a year. Safe here: the Let's Encrypt certificate covers
    # both aurasoft.co and www.aurasoft.co and auto-renews (verified with
    # `certbot renew --dry-run`). Deliberately no `preload` — that ships the
    # domain to a browser-baked list which is slow and painful to undo.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Block MIME-type sniffing.
    Header always set X-Content-Type-Options "nosniff"

    # Disallow framing by other origins (clickjacking). frame-ancestors in the
    # CSP below supersedes this in modern browsers; kept for older ones.
    Header always set X-Frame-Options "SAMEORIGIN"

    # Send the full referrer within the site, origin-only cross-site, and
    # nothing at all when downgrading to HTTP.
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Switch off browser features this site never uses.
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"

    # Content Security Policy.
    #
    # 'unsafe-inline' is unavoidable rather than lazy: the live page carries 29
    # inline <style> blocks from The7 plus Google Tag Manager's own inline
    # bootstrap snippet, and GTM needs 'unsafe-eval' to run container tags.
    # A nonce-based policy would mean patching theme output on every release.
    # The policy still buys real protection — frame-ancestors, object-src
    # 'none', base-uri and form-action lock-down, and an allowlist that blocks
    # script injection from unknown hosts.
    #
    # img-src allows any https origin because the site legitimately renders
    # remote store artwork; tightening it would break those images.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; frame-src 'self' https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

</IfModule>
